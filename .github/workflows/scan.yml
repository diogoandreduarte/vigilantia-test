name: "GDPR Scan (On Demand)"

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Site(s) predefinido(s) a analisar"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sapo
          - publico
          - rtp
          - none
      custom_url:
        description: "URL personalizado (ex: https://exemplo.pt) — sobrepoe 'sites' se preenchido"
        required: false
        default: ""
        type: string
      custom_label:
        description: "Label para o URL personalizado (ex: exemplo_pt) — obrigatorio se custom_url preenchido"
        required: false
        default: ""
        type: string
      commit_results:
        description: "Guardar resultados no repo (atualiza GitHub Pages)"
        required: true
        default: true
        type: boolean

env:
  SPACY_MODEL: pt_core_news_sm

jobs:
  resolve-matrix:
    name: Resolver matriz de sites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Construir matriz
        id: set-matrix
        run: |
          CUSTOM_URL="${{ github.event.inputs.custom_url }}"
          CUSTOM_LABEL="${{ github.event.inputs.custom_label }}"
          INPUT="${{ github.event.inputs.sites }}"

          if [ -n "$CUSTOM_URL" ] && [ -n "$CUSTOM_LABEL" ]; then
            MATRIX="{\"include\":[{\"label\":\"${CUSTOM_LABEL}\",\"url\":\"${CUSTOM_URL}\"}]}"
          elif [ "$INPUT" = "all" ]; then
            MATRIX='{"include":[{"label":"sapo","url":"https://sapo.pt"},{"label":"publico","url":"https://publico.pt"},{"label":"rtp","url":"https://rtp.pt"}]}'
          elif [ "$INPUT" = "sapo" ]; then
            MATRIX='{"include":[{"label":"sapo","url":"https://sapo.pt"}]}'
          elif [ "$INPUT" = "publico" ]; then
            MATRIX='{"include":[{"label":"publico","url":"https://publico.pt"}]}'
          elif [ "$INPUT" = "rtp" ]; then
            MATRIX='{"include":[{"label":"rtp","url":"https://rtp.pt"}]}'
          else
            echo "Nenhum site selecionado"
            exit 1
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias de sistema (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0 \
            libcairo2 libffi-dev libxml2 libxslt1.1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install \
            "requests>=2.34.2" "beautifulsoup4>=4.14.3" "playwright>=1.60.0" \
            "pydantic>=2.13.4" "typer>=0.26.2" "pyyaml>=6.0" \
            "jinja2>=3.1" "weasyprint>=62.0" "spacy>=3.7" "langdetect>=1.0.9" \
            "click>=8.0"

      - name: Download modelo spaCy
        run: python -m spacy download ${{ env.SPACY_MODEL }}

      - name: Instalar Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Preparar pastas
        run: mkdir -p docs/data scan-results

      - name: Analisar ${{ matrix.label }} (${{ matrix.url }})
        id: scan
        run: |
          LABEL="${{ matrix.label }}"
          URL="${{ matrix.url }}"
          DATE="$(date -u +%Y-%m-%d)"
          python -m src.cli analyze "${URL}" \
            --output "scan-results/${LABEL}_${DATE}.json" \
            --html   "scan-results/${LABEL}_${DATE}.html" \
            --quiet --no-history || true
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Atualizar historico em docs/data
        if: ${{ github.event.inputs.commit_results == 'true' }}
        run: |
          LABEL="${{ matrix.label }}"
          DATE="${{ steps.scan.outputs.date }}"
          python scripts/append_scan.py \
            "${LABEL}" \
            "${{ matrix.url }}" \
            "${DATE}" \
            "scan-results/${LABEL}_${DATE}.json" \
            "docs/data/${LABEL}_pt.json"

      - name: Commit historico para o repo
        if: ${{ github.event.inputs.commit_results == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/${{ matrix.label }}_pt.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes para ${{ matrix.label }}"
            exit 0
          fi
          git commit -m "chore(data): scan ${{ matrix.label }} - ${{ steps.scan.outputs.date }} [on-demand]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 10
          done

      - name: Upload artefactos
        uses: actions/upload-artifact@v4
        with:
          name: vigilantia-${{ matrix.label }}-${{ steps.scan.outputs.date }}
          path: scan-results/
          retention-days: 90
