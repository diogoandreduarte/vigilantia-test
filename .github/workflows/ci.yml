name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SPACY_MODEL: pt_core_news_sm

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libcairo2 \
            libffi-dev \
            libxml2 \
            libxslt1.1

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "requests>=2.34.2" \
            "beautifulsoup4>=4.14.3" \
            "pydantic>=2.13.4" \
            "typer>=0.26.2" \
            "pyyaml>=6.0" \
            "jinja2>=3.1" \
            "weasyprint>=62.0" \
            "spacy>=3.7" \
            "langdetect>=1.0.9" \
            pytest

      - name: Download spaCy model
        run: python -m spacy download ${{ env.SPACY_MODEL }}

      - name: Run pytest
        run: |
          pytest tests/test_rule_engine.py tests/test_reporter.py -v \
            --tb=short \
            -p no:cacheprovider
