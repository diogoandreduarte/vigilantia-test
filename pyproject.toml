[project]
name = "vigilantia"
version = "0.1.0"
description = ""
authors = [
    {name = "joaorego7",email = "joaorego.mo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "playwright (>=1.60.0,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "typer (>=0.26.2,<0.27.0)",
    "pyyaml (>=6.0,<7.0)",
    "jinja2 (>=3.1,<4.0)",
    "weasyprint (>=62.0,<63.0)",
    "pydyf (>=0.10,<0.11)",
    "spacy (>=3.7,<4.0)",
    "langdetect (>=1.0.9,<2.0.0)"
]

[tool.poetry]
packages = [{include = "vigilantia", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
